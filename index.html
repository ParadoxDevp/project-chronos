<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chronos AI — Holographic Era Snapshot</title>

<!-- Tailwind CDN for convenience -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#030205;
    --dim-purple: rgba(120,90,150,0.18); /* grid base */
    --hover-glow: rgba(139,92,246,0.28); /* neon glow on hover */
    --accent: #8b5cf6;
    --card-bg: rgba(255,255,255,0.03);
    --input-bg: rgba(0,0,0,0.45);
  }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
    color:#efeefe;
    overflow-x:hidden;
  }

  /* ---------- GRID CANVAS (Unchanged) ---------- */
  #grid-canvas {
    position:fixed;
    inset:0;
    z-index:0;
    display:block;
    background: radial-gradient(1200px 600px at 10% 20%, rgba(10,6,12,0.15), transparent 8%),
                radial-gradient(1200px 700px at 90% 80%, rgba(20,10,30,0.12), transparent 8%);
  }
  .star-overlay{ 
    position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.03; 
    background-image: radial-gradient(rgba(255,255,255,0.65) 1px, transparent 1px); 
    background-size:320px 320px; filter: blur(1px); 
  }

  /* ---------- UI LAYERS ---------- */
  .content-layer{ 
    position:relative; 
    z-index:10; 
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 64px 20px 40px 20px;
    box-sizing: border-box;
  }
  
  /* Centered Main Title */
  .hero-title{ 
    font-size: clamp(3rem, 6vw, 4.5rem); 
    font-weight:800; 
    letter-spacing:-2px; 
    background:linear-gradient(90deg,#f3eaff,#d7c9ff); 
    -webkit-background-clip:text; 
    background-clip:text; 
    color:transparent; 
    text-transform:uppercase;
    margin: 0;
    margin-bottom: 2rem;
    text-align: center;
    transform: translateY(-20px);
    opacity: 0;
    animation: fadeInSlide .8s cubic-bezier(.2,.9,.2,1) 0.2s forwards;
  }

  /* Search Input Style */
  .main-search-wrap {
    width: min(700px, 100%);
    display: flex;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    transform: translateY(-20px);
    opacity: 0;
    animation: fadeInSlide .8s cubic-bezier(.2,.9,.2,1) 0.4s forwards;
  }
  .main-search-wrap input{
    flex: 1;
    padding: 16px 20px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    font-weight: 600;
    background: var(--input-bg);
    color: #fff; 
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .main-search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.3);
  }
  .main-search-wrap button {
    position: absolute;
    right: 8px;
    top: 8px;
    height: 40px;
    width: 40px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.3s, transform 0.1s;
  }
  .main-search-wrap button:hover {
    background: #6d28d9;
    transform: scale(1.05);
  }
  
  /* Animations */
  @keyframes fadeInSlide{
    to{ opacity:1; transform:none; }
  }

  /* Responsive Adjustments */
  @media (max-width: 900px) {
    .main-search-wrap {
      width: min(500px, 100%);
    }
    .hero-title {
      font-size: clamp(2.5rem, 10vw, 4rem); 
    }
  }

  /* --- ADDED FOR LOADER AND RESULTS --- */
  .hidden { display: none !important; }

  /* --- MODAL STYLES --- */
  #generation-modal {
    position: fixed;
    inset: 0; /* top, right, bottom, left = 0 */
    z-index: 100; /* High z-index to cover everything */
    background-color: rgba(3, 2, 5, 0.85); /* Dark, translucent background */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-y: auto; /* Allow scrolling for small screens */
  }
  #generation-modal-content {
    background: rgba(10, 8, 15, 0.7); /* Slightly distinct background for the content box */
    padding: 30px;
    border-radius: 16px;
    border: 1px solid var(--accent);
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.4);
    position: relative;
    backdrop-filter: blur(8px);
    
    max-width: 1000px; 
    width: 90%; 
    margin: 30px auto; /* Ensure some margin top/bottom */
  }
  
  .loader-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 180px;
    height: 180px;
    font-family: "Inter", sans-serif;
    font-size: 1.2em;
    font-weight: 300;
    color: white;
    border-radius: 50%;
    user-select: none;
  }

  .loader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background-color: transparent;
    animation: loader-rotate 2s linear infinite;
    z-index: 0;
  }

  @keyframes loader-rotate {
    0% {
      transform: rotate(90deg);
      box-shadow:
        0 10px 20px 0 #fff inset,
        0 20px 30px 0 #ad5fff inset,
        0 60px 60px 0 #471eec inset;
    }
    50% {
      transform: rotate(270deg);
      box-shadow:
        0 10px 20px 0 #fff inset,
        0 20px 10px 0 #d60a47 inset,
        0 40px 60px 0 #311e80 inset;
    }
    100% {
      transform: rotate(450deg);
      box-shadow:
        0 10px 20px 0 #fff inset,
        0 20px 30px 0 #ad5fff inset,
        0 60px 60px 0 #471eec inset;
    }
  }

  .loader-letter {
    display: inline-block;
    opacity: 0.4;
    transform: translateY(0);
    animation: loader-letter-anim 2s infinite;
    z-index: 1;
    border-radius: 50ch;
    border: none;
  }

  .loader-letter:nth-child(1) { animation-delay: 0s; }
  .loader-letter:nth-child(2) { animation-delay: 0.1s; }
  .loader-letter:nth-child(3) { animation-delay: 0.2s; }
  .loader-letter:nth-child(4) { animation-delay: 0.3s; }
  .loader-letter:nth-child(5) { animation-delay: 0.4s; }
  .loader-letter:nth-child(6) { animation-delay: 0.5s; }
  .loader-letter:nth-child(7) { animation-delay: 0.6s; }
  .loader-letter:nth-child(8) { animation-delay: 0.7s; }
  .loader-letter:nth-child(9) { animation-delay: 0.8s; }
  .loader-letter:nth-child(10) { animation-delay: 0.9s; }

  @keyframes loader-letter-anim {
    0%,
    100% {
      opacity: 0.4;
      transform: translateY(0);
    }
    20% {
      opacity: 1;
      transform: scale(1.15);
    }
    40% {
      opacity: 0.7;
      transform: translateY(0);
    }
  }

  /* --- NEW TIMELINE CSS --- */
  #era-timeline-marker {
    transition: left 0.5s ease-out; /* For smooth stopping transition */
    box-shadow: 0 0 10px 2px var(--accent);
  }
  
  /* Running animation for the indicator */
  .timeline-running #era-timeline-marker {
    animation: scan 2s linear infinite;
  }
  @keyframes scan {
    0% { left: 0%; }
    50% { left: 100%; }
    100% { left: 0%; }
  }

  .timeline-label {
    transition: opacity 0.5s;
    position: absolute;
    top: -24px;
    background-color: var(--accent);
    padding: 2px 8px;
    border-radius: 6px;
    transform: translateX(-50%);
    font-size: 0.875rem; /* text-sm */
    line-height: 1.25rem; /* leading-tight */

  #timeline-scale-container {
      position: relative;
      padding-top: 30px; /* Space for the target year label */
  }

  #paraphrased-output {
      height: 300px; /* Fixed height for visual consistency in the modal */
      min-height: 200px;
  }
  
  #sources-report a {
      color: #93c5fd; /* Tailwind blue-300 */
  }
  /* --- END NEW TIMELINE CSS --- */
</style>

<script>
/* ============================
   GRID WAVE BACKGROUND (canvas) - (UNMODIFIED)
   ============================ */
(function(){
  const canvas = document.getElementById('grid-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d', { alpha: true });
  let W = innerWidth, H = innerHeight;
  const DPR = Math.max(1, devicePixelRatio || 1);

  function resize(){
    W = innerWidth; H = innerHeight;
    canvas.width = Math.max(800, W) * DPR;
    canvas.height = Math.max(600, H) * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildGrid();
  }
  
  // grid config
  let nodes = [];
  function buildGrid(){
    nodes = [];
    const spacingX = Math.max(40, W / 36);
    const spacingY = Math.max(40, H / 18);
    const colsN = Math.ceil(W / spacingX) + 2;
    const rowsN = Math.ceil(H / spacingY) + 2;
    for (let i=0;i<colsN;i++){
      const col = [];
      for (let j=0;j<rowsN;j++){
        const x = (i - 1) * spacingX;
        const y = (j - 1) * spacingY;
        col.push({ x, y, baseY: y, phase: Math.random()*Math.PI*2 });
      }
      nodes.push(col);
    }
  }
  
  // pointer for parallax and glow
  const pointer = { x: -9999, y: -9999 };
  window.addEventListener('mousemove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
  window.addEventListener('mouseleave', () => { pointer.x = -9999; pointer.y = -9999; });

  let tStart = performance.now();

  function draw(){
    if (!ctx) return;
    ctx.clearRect(0,0,W,H);

    // dark background fill subtle
    const bgG = ctx.createLinearGradient(0,0,0,H);
    bgG.addColorStop(0, 'rgba(6,6,10,1)');
    bgG.addColorStop(1, 'rgba(3,2,6,1)');
    ctx.fillStyle = bgG;
    ctx.fillRect(0,0,W,H);

    // compute wave amplitude based on time and pointer proximity
    const now = performance.now();
    const elapsed = (now - tStart) / 1000;
    const globalAmp = 8; // base amplitude of waves
    
    // dynamic amplitude near pointer
    for (let i=0;i<nodes.length;i++){
      for (let j=0;j<nodes[i].length;j++){
        const n = nodes[i][j];
        // have a gentle wave across x and time
        const wave = Math.sin((n.x*0.002 + elapsed*0.9) + n.phase) * Math.cos((n.y*0.002 + elapsed*0.6) + n.phase);
        // pointer influence (distance)
        const dx = pointer.x - n.x;
        const dy = pointer.y - n.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        const influence = Math.max(0, 1 - (d / 240)); // influence radius ~240px
        n.y = n.baseY + wave * (globalAmp + 18*influence) - influence * 18; // combined
      }
    }

    // draw horizontal polylines (rows)
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(110,84,140,0.14)';
    for (let j=0;j<nodes[0].length;j++){
      ctx.beginPath();
      for (let i=0;i<nodes.length;i++){
        const n = nodes[i][j];
        if (i === 0) ctx.moveTo(n.x, n.y);
        else ctx.lineTo(n.x, n.y);
      }
      ctx.stroke();
    }

    // draw vertical polylines (columns)
    for (let i=0;i<nodes.length;i++){
      ctx.beginPath();
      for (let j=0;j<nodes[i].length;j++){
        const n = nodes[i][j];
        if (j === 0) ctx.moveTo(n.x, n.y);
        else ctx.lineTo(n.x, n.y);
      }
      ctx.stroke();
    }

    // glow highlight: draw rings of brighter neon where pointer near
    if (pointer.x > -1000){
      const radius = 220;
      const grd = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, radius);
      grd.addColorStop(0, 'rgba(139,92,246,0.26)');
      grd.addColorStop(0.2, 'rgba(139,92,246,0.14)');
      grd.addColorStop(1, 'rgba(80,40,130,0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, radius, 0, Math.PI*2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    // draw brighter line segments near pointer for neon effect
    const glowRadius = 160;
    for (let i=0;i<nodes.length;i++){
      for (let j=0;j<nodes[i].length;j++){
        const n = nodes[i][j];
        const dx = pointer.x - n.x;
        const dy = pointer.y - n.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < glowRadius){
          const alpha = (1 - d / glowRadius) * 0.9;
          // draw small luminous point
          ctx.beginPath();
          ctx.fillStyle = `rgba(200,170,255,${Math.min(0.35, alpha*0.28)})`;
          ctx.arc(n.x, n.y, 1.4 + alpha*2.8, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }

    requestAnimationFrame(draw);
  }
  
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);

})();

(function(){

  const searchSection = document.getElementById('search-section');
  const generationModal = document.getElementById('generation-modal'); 
  const resultsSection = document.getElementById('results-section');
  
  const searchInput = document.getElementById('main-search');

  const paraphrasedOutput = document.getElementById('paraphrased-output'); 

  // --- Timeline Elements ---
  const timelineBox = document.getElementById('timeline-box');
  const eraGuessOutput = document.getElementById('era-guess-output');
  const eraTimelineMarker = document.getElementById('era-timeline-marker');
  const timelineStartYear = document.getElementById('timeline-start-year');
  const timelineEndYear = document.getElementById('timeline-end-year');

  // --- Context Box Elements ---

  const fastContextTone = document.getElementById('fast-context-tone');
  const fastContextSummary = document.getElementById('fast-context-summary');
  const contextBoxesContainer = document.getElementById('context-boxes-container'); 
  
  // --- API Configuration ---
  const apiKey = "AIzaSyCSznfN9kAsUuDQe2zUDvvVfXxDH7ABxAs"; 
  const RECONSTRUCT_MODEL = 'gemini-2.5-flash-preview-09-2025';
  const CONTEXT_MODEL = 'gemini-2.5-flash-preview-09-2025'; 

  // --- State ---
  let lastReconstructedText = '';
  let lastOriginalFragment = '';
  let timelineInterval;
  let isTimelineRunning = false;

  // --- Modal Control Functions ---
  function showModal() {
      generationModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden'; 
  }

  function hideModal() {
      generationModal.classList.add('hidden');
      document.body.style.overflow = '';
  }
  
  // --- Core App Reset Logic ---
  function fullAppResetAndHideModal() {
      resetTimeline(); 
      hideModal();
      // Ensure the UI reverts to the initial search state
      resultsSection.classList.add('hidden');
      searchSection.classList.remove('hidden');

      lastReconstructedText = '';
      lastOriginalFragment = '';
      searchInput.focus();
  }
  
  // --- Manual Modal Close (Keep processing running) ---
  function closeOnlyModal() {
      hideModal();
      // API calls continue in the background. Results section remains visible (or becomes visible)
      // to the user immediately, allowing them to wait for the data.
  }

  // --- Timeline Logic ---
  function generateRandomString(length) {
      const characters = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*()_+-=[]{}:"|\\,./<>?';
      let result = '';
      const charactersLength = characters.length;
      for (let i = 0; i < length; i++) {
          result += characters.charAt(Math.floor(Math.random() * charactersLength));
      }
      return result;
  }
  
  function startTimelineAndContextScan() {
      if (isTimelineRunning) return;
      isTimelineRunning = true;
      
      // Make boxes visible
      timelineBox.classList.remove('hidden');
      contextBoxesContainer.classList.remove('hidden');

      timelineBox.classList.add('timeline-running');
      eraTimelineMarker.style.removeProperty('left'); 
      eraTimelineMarker.classList.remove('hidden');

      // Set initial state (scanning effect)
      timelineStartYear.textContent = '';
      timelineEndYear.textContent = '';
      eraGuessOutput.textContent = "SCANNING...";
      eraGuessOutput.classList.remove('text-green-400');
      eraGuessOutput.classList.add('text-purple-400'); 

      function updateTimelineRunning() {
        // Timeline years scanning
        timelineStartYear.textContent = generateRandomString(4);
        timelineEndYear.textContent = generateRandomString(4);
        eraGuessOutput.textContent = generateRandomString(6);
        
        // Context boxes scanning
        fastContextSlang.innerHTML = `<li class="text-gray-400 font-mono">${generateRandomString(15)}</li>`;
        fastContextTone.textContent = generateRandomString(30);
        fastContextSummary.textContent = generateRandomString(60);
      }
      timelineInterval = setInterval(updateTimelineRunning, 50); 
  }

  function stopTimeline(targetYear) {
      if (!isTimelineRunning) return;
      isTimelineRunning = false;

      clearInterval(timelineInterval);
      timelineBox.classList.remove('timeline-running');

      const startYear = 2000;
      const endYear = 2024;
      
      const estimatedYear = parseInt(targetYear.match(/\d+/)?.[0] || '2012');
      const clampedYear = Math.max(startYear, Math.min(endYear, estimatedYear));
      const positionPercentage = ((clampedYear - startYear) / (endYear - startYear)) * 100;
      
      timelineStartYear.textContent = startYear;
      timelineEndYear.textContent = endYear;
      eraTimelineMarker.style.left = `${positionPercentage}%`;
  }
  
  function resetTimeline() {
      clearInterval(timelineInterval);
      isTimelineRunning = false;
      
      timelineBox.classList.add('hidden'); 
      contextBoxesContainer.classList.add('hidden'); 

      timelineBox.classList.remove('timeline-running');
      timelineStartYear.textContent = '';
      timelineEndYear.textContent = '';
      eraTimelineMarker.style.removeProperty('left');
      
      eraGuessOutput.textContent = 'Awaiting Fragment...';
      eraGuessOutput.classList.remove('text-green-400');
      eraGuessOutput.classList.add('text-purple-400');
      
      fastContextSlang.innerHTML = '<li class="text-gray-400">Scanning...</li>';
      fastContextTone.textContent = 'Scanning...';
      fastContextSummary.textContent = 'Scanning...';
  }

  // --- JSON Schema for Fast Context (Structured Output) ---
  const fastContextSchema = {
      type: "OBJECT",
      properties: {
          "era_year": { 
              "type": "STRING", 
              "description": "The most specific estimated single year of origin (e.g., '2007')." 
          },
          "slang_definitions": {
              "type": "ARRAY",
              "description": "A list of abbreviations and slang terms and their full definitions found in the text.",
              "items": {
                  "type": "OBJECT",
                  "properties": {
                      "term": { "type": "STRING" },
                      "definition": { "type": "STRING" }
                  },
                  "propertyOrdering": ["term", "definition"]
              }
          },
          "tone_analysis": {
              "type": "STRING",
              "description": "A single, concise sentence analyzing the emotional tone (e.g., 'The tone is frustrated, urgent, and highly personal.')."
          },
          "artifact_summary": {
              "type": "STRING",
              "description": "A single paragraph summarizing the linguistic register (e.g., 'Extremely informal, compressed text messaging style') and core social context."
          }
      },
      "propertyOrdering": ["era_year", "slang_definitions", "tone_analysis", "artifact_summary"]
  };

  /** Renders the fast context (JSON output) into the report section, including the timeline visualization. */
  function renderFastContext(data) {
      // 1. Era Guess and Timeline (STOPS SCAN)
      const yearText = data.era_year || '2012'; 
      stopTimeline(yearText); 

      eraGuessOutput.textContent = yearText;
      eraGuessOutput.classList.remove('text-purple-400');
      eraGuessOutput.classList.add('text-green-400');
      
      // 2. Slang Definitions
      fastContextSlang.innerHTML = '';
      if (data.slang_definitions && Array.isArray(data.slang_definitions) && data.slang_definitions.length > 0) {
          data.slang_definitions.forEach(item => {
              const li = document.createElement('li');
              li.className = 'text-gray-200';
              li.innerHTML = `<span class="font-semibold text-purple-300">${item.term.toUpperCase()}</span>: ${item.definition}`;
              fastContextSlang.appendChild(li);
          });
      } else {
          fastContextSlang.innerHTML = '<li class="text-gray-400">No specific slang or abbreviations detected.</li>';
      }

      // 3. Tone Analysis
      fastContextTone.textContent = data.tone_analysis || 'Tone analysis is unavailable.';
      
      // 4. Artifact Summary
      fastContextSummary.textContent = data.artifact_summary || 'Artifact summary is unavailable.';
  }

  // --- Step 2A: Context (AI Only, JSON Output) - NO GOOGLE SEARCH ---
  async function callGeminiFastContext(originalFragment, reconstructedText) {
      if (!apiKey) {
          fastContextSummary.textContent = "Error: API Key is required.";
          stopTimeline('2012'); 
          return;
      }
      
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${CONTEXT_MODEL}:generateContent?key=${apiKey}`;
      
      // System prompt updated to reflect that it relies on internal knowledge only
      const systemPrompt = "You are an AI Linguist specializing in historical digital text and contemporary slang. Analyze the provided text based solely on your internal knowledge. Provide your analysis in the strict JSON format requested below. DO NOT use external search tools.";

      const userQuery = `Analyze this digital artifact. Original Fragment: "${originalFragment}". Reconstructed Text: "${reconstructedText}". Please provide the following: 1. The most likely single year. 2. Definitions for all abbreviations or slang terms. 3. A single sentence analyzing the tone. 4. A paragraph summarizing the linguistic register and core social context.`;
      
      const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: {
              parts: [{ text: systemPrompt }]
          },
          // REMOVED: tools: [{ "google_search": {} }], 
          generationConfig: {
              responseMimeType: "application/json",
              responseSchema: fastContextSchema
          }
      };

      try {
          const result = await resilientFetch(apiUrl, payload);
          
          const candidate = result.candidates?.[0];
          const jsonText = candidate?.content?.parts?.[0]?.text;
          
          // REMOVED: Source extraction logic (not needed without Google Search)

          if (jsonText) {
              const fastData = JSON.parse(jsonText);
              renderFastContext(fastData); 
          } else {
              fastContextSummary.textContent = 'Error: The AI did not return a valid JSON output.';
              stopTimeline('2012'); 
          }
          
      } catch (error) {
          fastContextSummary.textContent = `Error during context analysis: ${error.message}`;
          stopTimeline('2012'); 
          throw error; 
      }
  }

  // --- Step 2B: Linguistic Modernization (Shashi Tharoorified Style) ---
  async function callGeminiParaphrase(reconstructedText) {
      if (!apiKey) {
          paraphrasedOutput.value = "Error: API Key is required. Please check configuration.";
          return;
      }
      
      loadingMessage.textContent = "Translating to Shashi Tharoorified Academic Style...";
      
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${RECONSTRUCT_MODEL}:generateContent?key=${apiKey}`;
      
      const systemPrompt = "You are a master rhetorician and linguistic maximalist, tasked with transforming informal digital text into a highly formal, verbose, and academic style, reminiscent of Shashi Tharoor. Employ complex, meandering sentence structures, esoteric vocabulary, and an elevated register. Eliminate all slang, contractions, and colloquialisms, prioritizing polysyllabic terminology and intellectual gravitas. Output ONLY the paraphrased text.";
      
      const userQuery = `Original Text to be rendered in Shashi Tharoorified style: "${reconstructedText}"`;

      const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: {
              parts: [{ text: systemPrompt }]
          },
      };

      try {
          const result = await resilientFetch(apiUrl, payload);
          const text = result.candidates?.[0]?.content?.parts?.[0]?.text || 'Error: Could not complete paraphrase.';
          paraphrasedOutput.value = text.trim();
      } catch (error) {
          paraphrasedOutput.value = `Error during Shashi Tharoorified paraphrasing: ${error.message}`;
          throw error; // Propagate error up to Promise.all
      }
  }
  
  // --- Resilient Fetch with Exponential Backoff (Unchanged) ---
  async function resilientFetch(url, payload, retries = 3, delay = 1000) {
      for (let i = 0; i < retries; i++) {
          try {
              const response = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
              });
              if (!response.ok) {
                  const errorBody = await response.json();
                  throw new Error(`API Error: ${response.status} ${response.statusText} - ${errorBody?.error?.message || 'Unknown error'}`);
              }
              return await response.json();
          } catch (error) {
              if (i === retries - 1) throw error;
              await new Promise(resolve => setTimeout(resolve, delay));
              delay *= 2; // Exponential backoff
          }
      }
  }


  // --- Text Reconstruction (AI Only) ---
  async function callGeminiReconstruct(userQuery) {
      if (!apiKey) {
          reconstructedOutput.value = "Error: API Key not found. Please check your configuration.";
          fullAppResetAndHideModal(); // Use full reset on critical config error
          return;
      }

      loadingMessage.textContent = "Reconstructing Fragment...";
      lastOriginalFragment = userQuery; 

      // STEP 1: Show results view and start all scanning effects immediately.
      resultsSection.classList.remove('hidden');
      startTimelineAndContextScan();
      
      reconstructedOutput.value = 'Data stream active... awaiting initial text reconstruction.';
      paraphrasedOutput.value = 'While you await the reconstruction, here is a Shashi Tharoorified version of the core concept...'; // Reset placeholder

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${RECONSTRUCT_MODEL}:generateContent?key=${apiKey}`;
      
      const systemPrompt = "You are a text reconstruction expert. Your task is to take a fragmented or obscured digital text and provide its fully reconstructed, clear, and complete meaning. **You must only output the reconstructed text and nothing else.** Do not include commentary, labels (like 'Reconstructed Text:'), or source information.";

      const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
      };

      try {
          const result = await resilientFetch(apiUrl, payload);
          const text = result.candidates?.[0]?.content?.parts?.[0]?.text || 'Error: Could not extract reconstructed text from the API response.';
          
          // STEP 2: Reconstruction complete. Fill the main box.
          lastReconstructedText = text.trim();
          reconstructedOutput.value = lastReconstructedText;
          
          // --- NEW SEQUENTIAL EXECUTION START ---
          
          // STEP 3 (A): Run Paraphrase FIRST (fills the modal box while waiting).
          loadingMessage.textContent = "Reconstruction Complete. Generating Shashi Tharoorified Paraphrase...";
          await callGeminiParaphrase(lastReconstructedText); 
          
          // STEP 3 (B): Run Context Analysis (updates timeline/context).
          loadingMessage.textContent = "Paraphrase Complete. Starting Context Analysis...";
          await callGeminiFastContext(lastOriginalFragment, lastReconstructedText);
          
          // --- NEW SEQUENTIAL EXECUTION END ---
          
          // Only hide the modal once the final step is successful
          hideModal();

      } catch (error) {
          reconstructedOutput.value = `A critical error occurred during processing: ${error.message}`;
          // On API failure, revert to the search page immediately
          fullAppResetAndHideModal(); 
      } 
  }

  // --- Main Search Handler ---
  function handleSearch(){
    const query = searchInput.value.trim();
    if (query) {
      searchSection.classList.add('hidden');
      resultsSection.classList.add('hidden'); 
      
      showModal(); 
      resetTimeline(); 
      
      callGeminiReconstruct(query); 
    } else {
      searchInput.focus(); 
    }
  }

  // --- Event Listeners ---
  searchButton.addEventListener('click', handleSearch);
  searchInput.addEventListener('keypress', (e)=>{ 
    if (e.key==='Enter') handleSearch(); 
  });
  
  // NEW LOGIC for New Search Button
  newSearchButton.addEventListener('click', fullAppResetAndHideModal);
  
  // NEW LOGIC for Modal Close Button (X)
  modalCloseButton.addEventListener('click', closeOnlyModal);

  // Keyboard listener for Escape key to close modal
  document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !generationModal.classList.contains('hidden')) {
          closeOnlyModal(); // ONLY closes the modal, keeps the page state.
      }
  });

  // Start the background animation
  window.onload = function() {
    console.log("Chronos AI UI loaded.");
    // Set initial timeline display
    timelineStartYear.textContent = '2000';
    timelineEndYear.textContent = '2024';
    eraGuessOutput.textContent = 'Awaiting Fragment...';
    eraGuessOutput.classList.remove('text-green-400');
    eraGuessOutput.classList.add('text-purple-400');
    eraTimelineMarker.classList.add('hidden'); 
  }


})();
</script>
