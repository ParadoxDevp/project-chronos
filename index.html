<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chronos AI — Holographic Era Snapshot</title>

<!-- Tailwind CDN for convenience -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#030205;
    --dim-purple: rgba(120,90,150,0.18); /* grid base */
    --hover-glow: rgba(139,92,246,0.28); /* neon glow on hover */
    --accent: #8b5cf6;
    --card-bg: rgba(255,255,255,0.03);
    --input-bg: rgba(0,0,0,0.45);
  }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
    color:#efeefe;
    overflow-x:hidden;
  }

  /* ---------- GRID CANVAS (Unchanged) ---------- */
  #grid-canvas {
    position:fixed;
    inset:0;
    z-index:0;
    display:block;
    background: radial-gradient(1200px 600px at 10% 20%, rgba(10,6,12,0.15), transparent 8%),
                radial-gradient(1200px 700px at 90% 80%, rgba(20,10,30,0.12), transparent 8%);
  }
  .star-overlay{ 
    position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.03; 
    background-image: radial-gradient(rgba(255,255,255,0.65) 1px, transparent 1px); 
    background-size:320px 320px; filter: blur(1px); 
  }

  /* ---------- UI LAYERS ---------- */
  .content-layer{ 
    position:relative; 
    z-index:10; 
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 64px 20px 40px 20px;
    box-sizing: border-box;
  }
  
  /* Centered Main Title */
  .hero-title{ 
    font-size: clamp(3rem, 6vw, 4.5rem); 
    font-weight:800; 
    letter-spacing:-2px; 
    background:linear-gradient(90deg,#f3eaff,#d7c9ff); 
    -webkit-background-clip:text; 
    background-clip:text; 
    color:transparent; 
    text-transform:uppercase;
    margin: 0;
    margin-bottom: 2rem;
    text-align: center;
    transform: translateY(-20px);
    opacity: 0;
    animation: fadeInSlide .8s cubic-bezier(.2,.9,.2,1) 0.2s forwards;
  }

  /* Search Input Style */
  .main-search-wrap {
    width: min(700px, 100%);
    display: flex;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    transform: translateY(-20px);
    opacity: 0;
    animation: fadeInSlide .8s cubic-bezier(.2,.9,.2,1) 0.4s forwards;
  }
  .main-search-wrap input{
    flex: 1;
    padding: 16px 20px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    font-weight: 600;
    background: var(--input-bg);
    color: #fff; 
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .main-search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.3);
  }
  .main-search-wrap button {
    position: absolute;
    right: 8px;
    top: 8px;
    height: 40px;
    width: 40px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.3s, transform 0.1s;
  }
  .main-search-wrap button:hover {
    background: #6d28d9;
    transform: scale(1.05);
  }
  
  /* Animations */
  @keyframes fadeInSlide{
    to{ opacity:1; transform:none; }
  }

  /* Responsive Adjustments */
  @media (max-width: 900px) {
    .main-search-wrap {
      width: min(500px, 100%);
    }
    .hero-title {
      font-size: clamp(2.5rem, 10vw, 4rem); 
    }
  }

  /* --- ADDED FOR LOADER AND RESULTS --- */
  .hidden { display: none !important; }

  .loader-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 180px;
    height: 180px;
    font-family: "Inter", sans-serif;
    font-size: 1.2em;
    font-weight: 300;
    color: white;
    border-radius: 50%;
    background-color: transparent;
    user-select: none;
  }

  .loader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background-color: transparent;
    animation: loader-rotate 2s linear infinite;
    z-index: 0;
  }

  @keyframes loader-rotate {
    0% {
      transform: rotate(90deg);
      box-shadow:
        0 10px 20px 0 #fff inset,
        0 20px 30px 0 #ad5fff inset,
        0 60px 60px 0 #471eec inset;
    }
    50% {
      transform: rotate(270deg);
      box-shadow:
        0 10px 20px 0 #fff inset,
        0 20px 10px 0 #d60a47 inset,
        0 40px 60px 0 #311e80 inset;
    }
    100% {
      transform: rotate(450deg);
      box-shadow:
        0 10px 20px 0 #fff inset,
        0 20px 30px 0 #ad5fff inset,
        0 60px 60px 0 #471eec inset;
    }
  }

  .loader-letter {
    display: inline-block;
    opacity: 0.4;
    transform: translateY(0);
    animation: loader-letter-anim 2s infinite;
    z-index: 1;
    border-radius: 50ch;
    border: none;
  }

  .loader-letter:nth-child(1) { animation-delay: 0s; }
  .loader-letter:nth-child(2) { animation-delay: 0.1s; }
  .loader-letter:nth-child(3) { animation-delay: 0.2s; }
  .loader-letter:nth-child(4) { animation-delay: 0.3s; }
  .loader-letter:nth-child(5) { animation-delay: 0.4s; }
  .loader-letter:nth-child(6) { animation-delay: 0.5s; }
  .loader-letter:nth-child(7) { animation-delay: 0.6s; }
  .loader-letter:nth-child(8) { animation-delay: 0.7s; }
  .loader-letter:nth-child(9) { animation-delay: 0.8s; }
  .loader-letter:nth-child(10) { animation-delay: 0.9s; }

  @keyframes loader-letter-anim {
    0%,
    100% {
      opacity: 0.4;
      transform: translateY(0);
    }
    20% {
      opacity: 1;
      transform: scale(1.15);
    }
    40% {
      opacity: 0.7;
      transform: translateY(0);
    }
  }

  .action-button {
    background-color: var(--accent);
    color: white;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
    transition: background-color 0.3s, transform 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .action-button:hover:not(:disabled) {
    background-color: #6d28d9;
    transform: translateY(-2px);
  }
  .action-button:disabled {
    background-color: #372f4b;
    color: #8a82a3;
    cursor: not-allowed;
  }

</style>
</head>
<body>

<!-- Grid canvas (Background) -->
<canvas id="grid-canvas" aria-hidden="true"></canvas>
<div class="star-overlay" aria-hidden="true"></div>

<!-- Main content layer -->
<section id="search-section" class="content-layer">
  <!-- Centered Title -->
  <h1 class="hero-title">Chronos AI</h1>
  
  <!-- Centered Search Input -->
  <div class="main-search-wrap" role="search">
    <input 
      id="main-search" 
      placeholder="Ask about an era (e.g., '1998', 'The Renaissance'), or a topic in time..." 
      aria-label="Search for an era or topic"
    >
    <button id="main-go" aria-label="Explore">
      <!-- Send Icon (Lucide-react style) -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send">
        <path d="m22 2-7 20-4-9-9-4 20-7z"/><path d="M22 2 11 13"/>
      </svg>
    </button>
  </div>
</section>

<!-- Loader Section -->
<section id="loader-section" class="content-layer hidden flex-col">
    <div class="loader-wrapper">
        <span class="loader-letter">G</span>
        <span class="loader-letter">e</span>
        <span class="loader-letter">n</span>
        <span class="loader-letter">e</span>
        <span class="loader-letter">r</span>
        <span class="loader-letter">a</span>
        <span class="loader-letter">t</span>
        <span class="loader-letter">i</span>
        <span class="loader-letter">n</span>
        <span class="loader-letter">g</span>
        <div class="loader"></div>
    </div>
    <p id="loading-message" class="mt-8 text-lg text-purple-300 animate-pulse"></p>
</section>

<!-- Results View -->
<section id="results-section" class="w-full max-w-4xl mx-auto p-8 hidden relative z-10">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-300 to-pink-400">Reconstruction</h2>
        <button id="new-search-button" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-300">New Search</button>
    </div>
    <textarea id="reconstructed-output" readonly class="w-full h-60 p-4 rounded-lg bg-black bg-opacity-40 border border-purple-800/50 text-gray-200 focus:ring-2 focus:ring-purple-500 focus:outline-none resize-none text-lg leading-relaxed shadow-lg"></textarea>
    <div class="flex items-center space-x-4 mt-4">
        <button id="context-button" class="action-button">Get Context</button>
        <button id="paraphrase-button" class="action-button">Paraphrase</button>
        <button id="tts-button" class="action-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            Speak
        </button>
    </div>
    <div id="context-report" class="mt-8 hidden">
        <!-- Context report will be rendered here -->
    </div>
</section>

<script src="config.js"></script>
<script>
/* ============================
   GRID WAVE BACKGROUND (canvas) - (UNMODIFIED)
   ============================ */
(function(){
  const canvas = document.getElementById('grid-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d', { alpha: true });
  let W = innerWidth, H = innerHeight;
  const DPR = Math.max(1, devicePixelRatio || 1);

  function resize(){
    W = innerWidth; H = innerHeight;
    canvas.width = Math.max(800, W) * DPR;
    canvas.height = Math.max(600, H) * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildGrid();
  }
  
  // grid config
  let nodes = [];
  function buildGrid(){
    nodes = [];
    const spacingX = Math.max(40, W / 36);
    const spacingY = Math.max(40, H / 18);
    const colsN = Math.ceil(W / spacingX) + 2;
    const rowsN = Math.ceil(H / spacingY) + 2;
    for (let i=0;i<colsN;i++){
      const col = [];
      for (let j=0;j<rowsN;j++){
        const x = (i - 1) * spacingX;
        const y = (j - 1) * spacingY;
        col.push({ x, y, baseY: y, phase: Math.random()*Math.PI*2 });
      }
      nodes.push(col);
    }
  }
  
  // pointer for parallax and glow
  const pointer = { x: -9999, y: -9999 };
  window.addEventListener('mousemove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
  window.addEventListener('mouseleave', () => { pointer.x = -9999; pointer.y = -9999; });

  let tStart = performance.now();

  function draw(){
    if (!ctx) return;
    ctx.clearRect(0,0,W,H);

    // dark background fill subtle
    const bgG = ctx.createLinearGradient(0,0,0,H);
    bgG.addColorStop(0, 'rgba(6,6,10,1)');
    bgG.addColorStop(1, 'rgba(3,2,6,1)');
    ctx.fillStyle = bgG;
    ctx.fillRect(0,0,W,H);

    // compute wave amplitude based on time and pointer proximity
    const now = performance.now();
    const elapsed = (now - tStart) / 1000;
    const globalAmp = 8; // base amplitude of waves
    
    // dynamic amplitude near pointer
    for (let i=0;i<nodes.length;i++){
      for (let j=0;j<nodes[i].length;j++){
        const n = nodes[i][j];
        // have a gentle wave across x and time
        const wave = Math.sin((n.x*0.002 + elapsed*0.9) + n.phase) * Math.cos((n.y*0.002 + elapsed*0.6) + n.phase);
        // pointer influence (distance)
        const dx = pointer.x - n.x;
        const dy = pointer.y - n.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        const influence = Math.max(0, 1 - (d / 240)); // influence radius ~240px
        n.y = n.baseY + wave * (globalAmp + 18*influence) - influence * 18; // combined
      }
    }

    // draw horizontal polylines (rows)
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(110,84,140,0.14)';
    for (let j=0;j<nodes[0].length;j++){
      ctx.beginPath();
      for (let i=0;i<nodes.length;i++){
        const n = nodes[i][j];
        if (i === 0) ctx.moveTo(n.x, n.y);
        else ctx.lineTo(n.x, n.y);
      }
      ctx.stroke();
    }

    // draw vertical polylines (columns)
    for (let i=0;i<nodes.length;i++){
      ctx.beginPath();
      for (let j=0;j<nodes[i].length;j++){
        const n = nodes[i][j];
        if (j === 0) ctx.moveTo(n.x, n.y);
        else ctx.lineTo(n.x, n.y);
      }
      ctx.stroke();
    }

    // glow highlight: draw rings of brighter neon where pointer near
    if (pointer.x > -1000){
      const radius = 220;
      const grd = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, radius);
      grd.addColorStop(0, 'rgba(139,92,246,0.26)');
      grd.addColorStop(0.2, 'rgba(139,92,246,0.14)');
      grd.addColorStop(1, 'rgba(80,40,130,0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, radius, 0, Math.PI*2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    // draw brighter line segments near pointer for neon effect
    const glowRadius = 160;
    for (let i=0;i<nodes.length;i++){
      for (let j=0;j<nodes[i].length;j++){
        const n = nodes[i][j];
        const dx = pointer.x - n.x;
        const dy = pointer.y - n.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < glowRadius){
          const alpha = (1 - d / glowRadius) * 0.9;
          // draw small luminous point
          ctx.beginPath();
          ctx.fillStyle = `rgba(200,170,255,${Math.min(0.35, alpha*0.28)})`;
          ctx.arc(n.x, n.y, 1.4 + alpha*2.8, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }

    requestAnimationFrame(draw);
  }
  
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);

})();


/* ============================
   CHRONOS AI - INTERACTIONS
   ============================ */
(function(){
  // --- DOM Elements ---
  const searchSection = document.getElementById('search-section');
  const loaderSection = document.getElementById('loader-section');
  const resultsSection = document.getElementById('results-section');
  
  const searchInput = document.getElementById('main-search');
  const searchButton = document.getElementById('main-go');
  const loadingMessage = document.getElementById('loading-message');

  const reconstructedOutput = document.getElementById('reconstructed-output');
  const contextReport = document.getElementById('context-report');
  
  const contextButton = document.getElementById('context-button');
  const paraphraseButton = document.getElementById('paraphrase-button');
  const ttsButton = document.getElementById('tts-button');
  const newSearchButton = document.getElementById('new-search-button');

  // --- API Configuration ---
  const apiKey = typeof GEMINI_API_KEY !== 'undefined' ? GEMINI_API_KEY : ""; // Fetches API key from config.js
  const RECONSTRUCT_MODEL = 'gemini-2.5-flash-preview-09-2025';

  // --- State ---
  let lastOriginalFragment = '';
  let lastReconstructedText = '';

  // --- Resilient Fetch with Exponential Backoff ---
  async function resilientFetch(url, payload, retries = 3, delay = 1000) {
      for (let i = 0; i < retries; i++) {
          try {
              const response = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
              });
              if (!response.ok) {
                  const errorBody = await response.json();
                  throw new Error(`API Error: ${response.status} ${response.statusText} - ${errorBody?.error?.message || 'Unknown error'}`);
              }
              return await response.json();
          } catch (error) {
              if (i === retries - 1) throw error;
              await new Promise(resolve => setTimeout(resolve, delay));
              delay *= 2; // Exponential backoff
          }
      }
  }

  // --- Step 1: Text Reconstruction (AI Only) ---
  async function callGeminiReconstruct(userQuery) {
      if (!apiKey) {
          alert("Error: API Key not found. Please create 'config.js' and set your GEMINI_API_KEY.");
          // Reset UI
          loaderSection.classList.add('hidden');
          searchSection.classList.remove('hidden');
          return;
      }

      loadingMessage.textContent = "Reconstructing Fragment...";
      contextButton.disabled = true;
      paraphraseButton.disabled = true;
      ttsButton.disabled = true;
      reconstructedOutput.value = '';
      contextReport.classList.add('hidden');

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${RECONSTRUCT_MODEL}:generateContent?key=${apiKey}`;
      
      const systemPrompt = "You are a text reconstruction expert. Your task is to take a fragmented or obscured digital text and provide its fully reconstructed, clear, and complete meaning. **You must only output the reconstructed text and nothing else.** Do not include commentary, labels (like 'Reconstructed Text:'), or source information.";

      const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
      };

      try {
          const result = await resilientFetch(apiUrl, payload);
          const text = result.candidates?.[0]?.content?.parts?.[0]?.text || 'Error: Could not extract reconstructed text from the API response.';
          
          lastOriginalFragment = userQuery;
          lastReconstructedText = text.trim();
          reconstructedOutput.value = lastReconstructedText;
          
          contextButton.disabled = false;
          paraphraseButton.disabled = false;
          ttsButton.disabled = false;
      } catch (error) {
          reconstructedOutput.value = `An error occurred: ${error.message}`;
          contextButton.disabled = true;
          paraphraseButton.disabled = true;
          ttsButton.disabled = true;
      } finally {
          loaderSection.classList.add('hidden');
          resultsSection.classList.remove('hidden');
      }
  }

  // --- Main Search Handler ---
  function handleSearch(){
    const query = searchInput.value.trim();
    if (query) {
      searchSection.classList.add('hidden');
      resultsSection.classList.add('hidden');
      loaderSection.classList.remove('hidden');
      callGeminiReconstruct(query);
    } else {
      searchInput.focus(); 
    }
  }

  // --- Event Listeners ---
  searchButton.addEventListener('click', handleSearch);
  searchInput.addEventListener('keypress', (e)=>{ 
    if (e.key==='Enter') handleSearch(); 
  });
  
  newSearchButton.addEventListener('click', () => {
      resultsSection.classList.add('hidden');
      loaderSection.classList.add('hidden');
      searchSection.classList.remove('hidden');
      searchInput.value = '';
      searchInput.focus();
  });

})();
</script>
</body>
</html>
